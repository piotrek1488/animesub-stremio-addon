name: Build and Push to Docker Hub

on:
  push:
    branches:
      - main  # Odpalenie przy każdym pushu do branchy main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      deployments: write

    environment:
      name: docker.io
      url: https://hub.docker.com/r/ludvickpro/animesub-stremio-addon

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Odczytanie wersji z pliku
      - name: Read version
        id: get_version
        run: |
          VERSION=$(cat version | tr -d "\n")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      # Chroni przed ponownym wykorzystaniem tej samej wersji
      # dla innego commita.
      - name: Check release tag
        id: release_tag
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          set -euo pipefail
          TAG="${VERSION}"
          # Dla tagów opisanych pobieramy SHA commita przez ^{}.
          REMOTE_SHA="$(
            git ls-remote --tags origin "refs/tags/${TAG}^{}" |
            awk 'NR == 1 { print $1 }'
          )"
          # Obsługa tagów prostych, bez opisu
          if [ -z "$REMOTE_SHA" ]; then
            REMOTE_SHA="$(
              git ls-remote --tags origin "refs/tags/${TAG}" |
              awk 'NR == 1 { print $1 }'
            )"
          fi
          if [ -z "$REMOTE_SHA" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          elif [ "$REMOTE_SHA" = "$GITHUB_SHA" ]; then
            echo "Tag $TAG already points this commit."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Tag $TAG already points to another commit: $REMOTE_SHA"
            echo "::error::Increment version number in \"version\" file."
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/animesub-stremio-addon:${{ steps.get_version.outputs.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/animesub-stremio-addon:latest
            ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}:latest

      - name: Tag released commit
        if: steps.release_tag.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          set -euo pipefail
          TAG="${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag \
            --annotate "$TAG" \
            "$GITHUB_SHA" \
            --message "Release $TAG"
          git push origin "refs/tags/$TAG"
